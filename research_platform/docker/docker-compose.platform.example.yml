# Example platform services. Adapt service names/networks to the existing Docker stack.
# The existing MySQL and Redis services are external dependencies in the MVP.
services:
  research-platform-api:
    build:
      context: ../..
      dockerfile: research_platform/docker/Dockerfile.backend
    environment:
      STOCKRNN_PLATFORM_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      STOCKRNN_ARTIFACT_ROOT: /workspace/output/platform
      PYTHONPATH: /workspace
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: ["uvicorn", "research_platform.backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  research-platform-worker:
    build:
      context: ../..
      dockerfile: research_platform/docker/Dockerfile.backend
    environment:
      STOCKRNN_PLATFORM_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      STOCKRNN_ARTIFACT_ROOT: /workspace/output/platform
      PYTHONPATH: /workspace
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    command: ["celery", "-A", "research_platform.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
